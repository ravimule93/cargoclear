steps:
  # =========================================================================
  # Step 1: Backend Unit Tests & Deterministic Engine Validation
  # =========================================================================
  - id: test-backend
    name: python:3.12-slim
    dir: backend
    entrypoint: bash
    args:
      - -c
      - |
        pip install --no-cache-dir -r requirements-dev.txt
        python -m pytest tests/unit tests/integration -q

  # =========================================================================
  # Step 2: Frontend Linting, Typecheck & Production Build
  # =========================================================================
  - id: build-frontend
    name: node:22-slim
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        npm ci --legacy-peer-deps
        npm run lint
        npm run typecheck
        npm run build

  # =========================================================================
  # Step 3: Build & Deploy Backend Container to Cloud Run (asia-south1)
  # =========================================================================
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        bash ./infra/deploy_api.sh
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'REGION=$_REGION'
      - 'RUNTIME_SERVICE_ACCOUNT=$_RUNTIME_SERVICE_ACCOUNT'
      # Required: deploy_api.sh refuses an unidentifiable release. Supply both
      # substitutions from the release workflow rather than relying on a
      # Cloud Build source archive to contain a .git directory.
      - 'RELEASE_SHA=$_RELEASE_SHA'
      - 'RELEASE_TIMESTAMP=$_RELEASE_TIMESTAMP'

  # =========================================================================
  # Step 4: Build & Deploy Frontend UI to Cloud Run
  # =========================================================================
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        bash ./infra/deploy_ui.sh
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'REGION=$_REGION'
      - 'UI_SERVICE_ACCOUNT=$_UI_SERVICE_ACCOUNT'

substitutions:
  _REGION: asia-south1
  # Required for a live API deployment. Cloud Build's deployer must be granted
  # iam.serviceAccounts.actAs on this dedicated runtime identity.
  _RUNTIME_SERVICE_ACCOUNT: ''
  # Required for the UI deployment: the UI's own identity, which is granted roles/run.invoker on the private API.
  # Cloud Build's deployer needs iam.serviceAccounts.actAs on it (and run.services.setIamPolicy on cargoclear-api).
  _UI_SERVICE_ACCOUNT: ''
  # The release workflow must set both values. Empty defaults intentionally
  # fail closed in infra/deploy_api.sh instead of publishing an unknown build.
  _RELEASE_SHA: ''
  _RELEASE_TIMESTAMP: ''

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: 'ALLOW_LOOSE'

