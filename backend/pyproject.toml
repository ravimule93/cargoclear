[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing -q"
markers = [
    "live: calls the real Gemini endpoint (needs credentials, APP_MODE=live and RUN_LIVE_SMOKE=1); see tests/live",
    "placeholder_pdfs: the test uploads placeholder bytes, so poppler is reported as not installed (see tests/conftest.py)",
    "real_poppler: the test needs the real poppler even though its module uses placeholder PDFs (see tests/conftest.py)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "S", "B", "A", "C4", "PT"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
