org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where each build flavor talks to (see android/README.md). Override on the command line with -P or in ~/.gradle/gradle.properties.
#   local   -> the backend on this computer, as the emulator sees it (10.0.2.2 is the emulator's name for the host).
#             Use http://10.0.2.2:3000/api/proxy/ to go through the Next.js dev server instead.
#   hosted  -> the deployed UI's proxy, https://<ui-host>/api/proxy/ . Left empty on purpose: the UI is not deployed yet, and an
#             empty value makes the app say "backend not configured" instead of calling a made-up host.
cargoclear.localApiBase=http://10.0.2.2:8080/api/v1/
cargoclear.hostedApiBase=
